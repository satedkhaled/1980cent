<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صورة المنتج</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a1f30;
    font-family: Cairo, Tahoma, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap {
    width: 100%; max-width: 520px; padding: 16px;
    text-align: center;
  }
  #img {
    width: 100%; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    display: none;
    background: #fff;
  }
  #state {
    color: #b3d9f5; font-size: 15px; font-weight: 700;
    padding: 40px 10px;
  }
  #state.error { color: #ff8080; }
</style>
</head>
<body>
<div id="wrap">
  <div id="state">⏳ بنحمّل الصورة...</div>
  <img id="img" alt="صورة المنتج">
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyCwy7C7pvIzxBV6aHDVkmL3X712RsxTjJU",
    authDomain: "cent-bec0a.firebaseapp.com",
    projectId: "cent-bec0a",
    storageBucket: "cent-bec0a.firebasestorage.app",
    messagingSenderId: "154245229914",
    appId: "1:154245229914:web:4cab3ee490b18cf9959763"
  });
  var db = firebase.firestore();
  // بعض شبكات الإنترنت/الموبايل في مصر بتحجب نوع الاتصال الافتراضي بتاع Firestore
  // فبيرجع "client is offline" حتى لو النت شغال. الحل: نجبره يستخدم long-polling.
  db.settings({ experimentalAutoDetectLongPolling: true, merge: true });

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var stateEl = document.getElementById('state');
  var imgEl = document.getElementById('img');

  function loadPhoto(attempt){
    db.collection('qr_photos').doc(id).get({ source: 'server' }).then(function(doc){
      if(doc.exists && doc.data().img){
        imgEl.src = doc.data().img;
        imgEl.style.display = 'block';
        stateEl.style.display = 'none';
      } else {
        stateEl.textContent = '⚠️ الصورة غير موجودة أو اتحذفت';
        stateEl.className = 'error';
      }
    }).catch(function(err){
      // أول فشل ممكن يكون بلبلة مؤقتة في الاتصال — نجرب تاني مرة واحدة قبل ما نستسلم
      if(attempt < 2){
        setTimeout(function(){ loadPhoto(attempt + 1); }, 1500);
      } else {
        stateEl.textContent = '⚠️ فشل تحميل الصورة، تأكد من الإنترنت';
        stateEl.className = 'error';
        console.log('qr view error', err);
      }
    });
  }

  if(!id){
    stateEl.textContent = '⚠️ رابط غير صحيح';
    stateEl.className = 'error';
  } else {
    loadPhoto(1);
  }
</script>
</body>
</html>
